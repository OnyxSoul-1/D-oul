<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D@%@$oul Studio v3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#1e1e1e;--panel:#252526;--line:#3b3b3b;--fg:#ccc;--dim:#858585;--teal:#4ec9b0;--blue:#007acc;--gold:#b58900;--purple:#8a2be2;--green:#2d8a4e;--red:#f85149}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Consolas,monospace}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .logo{font-size:18px;font-weight:bold;color:var(--teal)}
  header .logo span{color:var(--blue)}
  #q{background:#111;color:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-family:inherit;font-size:13px;width:260px}
  #q:focus{outline:none;border-color:var(--blue)}
  #tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:#1a1a1a;border-bottom:1px solid var(--line)}
  #tools button{background:#2d2d30;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:12px}
  #tools button:hover{border-color:var(--teal);color:var(--teal)}
  main{padding:16px;max-width:1100px;margin:0 auto}
  main h2{margin:0 0 12px;color:var(--teal);font-size:16px}
  textarea,input,pre{font-family:inherit}
  textarea{width:100%;box-sizing:border-box;background:#111;color:#eee;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;resize:vertical;min-height:110px;margin:4px 0}
  textarea[readonly]{color:var(--teal)}
  input[type=text],input:not([type]){width:100%;box-sizing:border-box;background:#111;color:#eee;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;margin:4px 0}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .row button,.tb{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:600;font-size:12px}
  .row button:hover,.tb:hover{filter:brightness(1.15)}
  .row button.purple,.tb.purple{background:var(--purple)}
  .row button.green{background:var(--green)}
  .row button.gold{background:var(--gold)}
  .row button.grey{background:#555}
  .row button.red{background:var(--red)}
  .out,pre.out{background:#06080b;border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;color:var(--teal);font-size:13px;min-height:40px;max-height:50vh;overflow:auto}
  .note{color:var(--dim);font-size:11px;margin-top:6px}
  .warn{color:var(--gold);font-size:12px}
  .err{color:var(--red);font-size:12px}
  .meter{height:6px;background:#111;border-radius:3px;overflow:hidden;margin:4px 0}
  .meter > div{height:100%;background:var(--teal);width:0;transition:.2s}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:700px){.split{grid-template-columns:1fr}}
  label{font-size:12px;color:var(--dim);display:block;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="logo">D@%@$oul <span>Studio</span> <small style="color:var(--dim);font-weight:normal;font-size:12px">v3</small></div>
  <input id="q" placeholder="tool search…  Ctrl+K">
</header>
<nav id="tools"></nav>
<main id="pane"></main>
<script src="studio.js"></script>
</body>
</html>
